<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radical Yes · Product Lifecycle Dashboard (Proof of Concept)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#fbf8f0;--surface:#ffffff;--ink:#141414;--muted:#6b675c;--line:#e9e3d2;--accent:#ffc20e;--accent2:#141414;--ok:#1e8e4e;--warn:#c77700;--bad:#c62828;--info:#2b2a26;--ph:#f3eedd;color-scheme:light}
:root[data-theme="dark"]{--bg:#100f0c;--surface:#1b1a16;--ink:#f7f3e8;--muted:#a39e8c;--line:#2e2b22;--accent:#ffc20e;--accent2:#f7f3e8;--ok:#41c27a;--warn:#f0a93b;--bad:#ff6b6b;--info:#f7f3e8;--ph:#26231c;color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Trebuchet MS","Avenir Next",system-ui,-apple-system,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:52px;height:52px;border-radius:50%;flex:none}
.brand small{display:block;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;padding:0;border-radius:50%;background:var(--surface);color:var(--ink);border:1px solid var(--line);cursor:pointer}
.icon-btn:hover{border-color:var(--accent)}
.pill{font-size:12px;background:var(--accent);color:#141414;padding:4px 10px;border-radius:99px;font-weight:700}
.tabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:12px 14px;color:var(--muted);font:inherit;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.filters{display:flex;gap:16px;padding:14px 24px;flex-wrap:wrap}
.filters label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
select,.ghost{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
main{padding:8px 24px 48px}
h3{font-size:15px;margin:24px 0 10px}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0 4px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-size:22px}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stages>div{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;cursor:pointer;color:inherit;font:inherit}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.cb{padding:10px 2px 0;display:flex;flex-direction:column;gap:2px}
.cb .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.ph{position:relative;aspect-ratio:1/1;background:var(--ph);border-radius:10px;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;color:var(--muted);font-weight:600}
.ph span small{font-weight:400}
.ph img+span{display:none}
.thumb{width:44px;height:44px;border-radius:8px;background:var(--ph);position:relative;overflow:hidden;flex:none}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;color:var(--muted)}
.thumb img+i{display:none}
.tp{display:flex;gap:10px;align-items:center}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line)}
.badge.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.badge.info{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart{position:relative;height:280px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
tbody tr[data-sku]{cursor:pointer}
tbody tr[data-sku]:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
tr.sel{background:color-mix(in srgb,var(--accent) 10%,transparent)!important}
td.low{color:var(--bad);font-weight:700}
td.over{color:var(--warn);font-weight:700}
td.na{color:var(--muted)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.alert span{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.alert.warn span{background:var(--warn)}
.alert.bad span{background:var(--bad)}
.alert.info span{background:var(--info)}
.p360{display:grid;grid-template-columns:120px 1fr auto;gap:18px;align-items:start}
.p360 .ph{width:120px}
.p360 h2{margin:0 0 4px;font-size:18px}
.hint{color:var(--muted);padding:14px 0;font-size:13px}
.late{color:var(--bad);font-weight:700}
.insights{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.ins-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.ins-head b{font-size:14px;text-transform:uppercase;letter-spacing:.1em}
.ins-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ins-cols h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ins-cols ul,.ins-cols ol{margin:0;padding-left:20px}
.ins-cols li{margin:5px 0}
.ins-cols ol li::marker{font-weight:800}
@media(max-width:800px){.ins-cols{grid-template-columns:1fr}}
.st-row{display:grid;grid-template-columns:220px 1fr 56px;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.st-label{display:flex;flex-direction:column;font-size:14px}
.st-label .muted{font-size:12px}
.st-plot{position:relative;height:64px;margin-right:64px}
.st-bar{position:absolute;left:0;top:16px;height:32px;background:var(--accent);border-radius:6px}
.st-img{position:absolute;top:8px;width:48px;height:48px;border-radius:8px;overflow:hidden;background:var(--ph);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.st-img img{width:100%;height:100%;object-fit:cover}
.st-img i{font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.st-pct{font-weight:700;text-align:right;font-size:14px}
@media(max-width:800px){.st-row{grid-template-columns:130px 1fr 44px}}
.shoe-fab{position:fixed;right:24px;bottom:24px;z-index:50;width:84px;height:84px;border:0;padding:0;background:transparent;cursor:pointer;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18));transition:transform .15s}
.shoe-fab:hover{transform:translateY(-3px) rotate(-3deg)}
.shoe-fab img{width:100%;height:100%;object-fit:contain}
.chat-pop{position:fixed;right:24px;bottom:120px;z-index:50;width:370px;max-width:calc(100vw - 32px);max-height:min(560px,calc(100vh - 150px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;box-shadow:0 12px 32px rgba(0,0,0,.18)}
.chat-pop[hidden]{display:none}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
.chat-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.chat-head b{font-size:15px}
.pills{display:flex;flex-direction:column;gap:8px;margin:10px 0 0}
.pill-q{width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:#8a8680;border-radius:99px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.pill-q:hover:not(:disabled){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.pill-q:disabled{opacity:.5;cursor:default}
.msgs{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0;flex:1 1 auto}
.msgs:empty{display:none}
.msg{max-width:82%;padding:10px 13px;border-radius:12px;white-space:pre-wrap;font-size:14px}
.msg.user{align-self:flex-end;background:var(--accent);color:#141414}
.msg.assistant{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.chat-form{display:flex;gap:8px}
.chat-form input{flex:1;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.send{background:var(--accent);color:#141414;border:0;border-radius:10px;padding:0 18px;font:inherit;font-weight:700;cursor:pointer}
.send:disabled{opacity:.5;cursor:default}
.note{font-size:12px;color:var(--muted);margin-top:24px}
@media(max-width:800px){.two{grid-template-columns:1fr}.p360{grid-template-columns:90px 1fr}.p360 .ph{width:90px}.p360 .ghost{grid-column:1/-1;justify-self:start}}
</style>
</head>

/* Seeded generator so the sample is stable on every reload */
const rng = s => () => (s = (s * 16807) % 2147483647) / 2147483647;
const R = rng(42);
DATA.products.forEach(p => {
  DATA.stock[p.id] = {};
  DATA.sizes.forEach(z => DATA.stock[p.id][z] = p.stage === 'Launched' ? Math.round(R() * 18) : 0);
  if (p.stage !== 'Launched') return;
  DATA.months.forEach((_, mi) => {
    if (mi < p.launch) return;
    [['Website', 1], ['North Melbourne store', .7]].forEach(([ch, f]) => {
      const boost = mi >= 9 ? 1.2 : 1;               // Oct–Nov lift
      const units = Math.round(p.base * f * boost * (.6 + R() * .8));
      const disc = mi === 10 ? 0.2 : 0;                       // November Black Friday sale
      const orders = Math.max(1, Math.round(units / (ch === 'Website' ? 1.4 : 1.2)));
      const repeat = Math.round(orders * (ch === 'Website' ? 0.32 : 0.18));
      DATA.sales.push({m:mi, sku:p.id, ch, units, list: units * p.price,
        revenue: Math.round(units * p.price * (1 - disc)), saleUnits: disc ? units : 0, orders, repeat});
    });
  });
});

/* ---------- State and helpers ---------- */
const S = {tab:'overview', range:'all', cat:'All', season:'All', sku:null};
const ASOF = new Date(DATA.asOf);
const $ = s => document.querySelector(s);
const sum = (a, k) => a.reduce((t, x) => t + x[k], 0);
const money = n => '$' + Math.round(n).toLocaleString('en-AU');
const pct = n => (n * 100).toFixed(0) + '%';
const prod = id => DATA.products.find(p => p.id === id);
const fp = () => DATA.products.filter(p => (S.cat === 'All' || p.category === S.cat) && (S.season === 'All' || p.season === S.season));
const fpIds = () => fp().map(p => p.id);
const inRange = mi => S.range === 'all' || mi >= 11 - Number(S.range);
const monthsInRange = () => DATA.months.map((_, i) => i).filter(inRange);
const monthLabel = m => new Date(m + '-01').toLocaleString('en-AU', {month:'short'});
const fmtDate = d => new Date(d).toLocaleDateString('en-AU', {day:'numeric', month:'short', year:'numeric'});
const daysTo = d => { const n = Math.round((new Date(d) - ASOF) / 864e5); return n > 0 ? n + ' days' : 'Launched'; };
const delayOf = o => o.stage === 'Received' ? o.late : Math.max(0, Math.round((ASOF - new Date(o.eta)) / 864e5));
const leadDays = o => Math.round((new Date(o.eta) - new Date(o.orderDate)) / 864e5);
const sizeTotal = id => DATA.sizes.reduce((a, z) => a + DATA.stock[id][z], 0);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const initials = p => p.name.replace(/[^A-Za-z ]/g, '').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('');
const STAGE = {'Launched':'ok', 'Sample in progress':'warn', 'Sample approved':'info'};
const PO = {'Cutting':'warn', 'Stitching':'info', 'QC':'info', 'In transit':'info', 'Received':'ok'};

function stats(id) {
  const sl = DATA.sales.filter(r => r.sku === id && inRange(r.m));
  const sold = sum(sl, 'units'), rev = sum(sl, 'revenue'), stock = sizeTotal(id);
  const inProd = DATA.purchaseOrders.filter(o => o.sku === id && o.stage !== 'Received').reduce((a, o) => a + o.ordered - o.produced, 0);
  return {sold, rev, stock, inProd, st: sold / ((sold + stock) || 1), sl};
}
function chUnits(sl, ch) { return sum(sl.filter(r => r.ch === ch), 'units'); }

function alerts() {
  const out = [];
  fp().forEach(p => {
    if (p.stage !== 'Launched') {
      if (p.stage === 'Sample in progress') out.push({sku:p.id, lvl:'info', t:`${p.name} (${p.colour}): sample round ${p.sample} awaiting approval`});
      return;
    }
    const low = DATA.sizes.filter(z => DATA.stock[p.id][z] <= 2);
    if (low.length) out.push({sku:p.id, lvl:'warn', t:`${p.name} (${p.colour}): low stock in AU ${low.join(', ')}`});
    const over = DATA.sizes.filter(z => DATA.stock[p.id][z] >= 16);
    if (over.length) out.push({sku:p.id, lvl:'info', t:`${p.name} (${p.colour}): overstock in AU ${over.join(', ')}`});
  });
  DATA.purchaseOrders.filter(o => fpIds().includes(o.sku) && delayOf(o) > 0)
    .forEach(o => out.push({sku:o.sku, lvl:'bad', t:`${o.po} from ${o.factory} is ${delayOf(o)} days past ETA`}));
  return out;
}

/* ---------- Shared components ---------- */
const media = p => `<div class="ph">${p.img ? `<img src="${p.img}" alt="${p.name} ${p.colour}" loading="lazy" onerror="this.remove()">` : ''}<span>${p.name}<small>${p.colour}</small></span></div>`;
const thumb = p => `<div class="thumb">${p.img ? `<img src="${p.img}" alt="" onerror="this.remove()">` : ''}<i>${initials(p)}</i></div>`;
const badge = (t, c) => `<span class="badge ${c || ''}">${t}</span>`;
const kpi = (l, v, s = '') => `<div class="kpi"><small>${l}</small><b>${v}</b>${s ? `<span class="muted">${s}</span>` : ''}</div>`;
const card = p => `<button class="card ${S.sku === p.id ? 'sel' : ''}" data-sku="${p.id}">${media(p)}<div class="cb"><b>${p.name}</b><span class="muted">${p.colour}</span><div class="row"><span>${money(p.price)}</span>${badge(p.category)}</div></div></button>`;

function panel() {
  if (!S.sku) return `<div class="hint">Select a product card or table row to see its data across every stage.</div>`;
  const p = prod(S.sku), s = stats(S.sku);
  return `<section class="panel p360">${media(p)}
    <div><h2>${p.name}</h2><p class="muted" style="margin:0">${p.colour} · ${p.id} · ${money(p.price)} · ${p.season} · ${p.category}</p>
    <div class="kpis">${kpi('Design stage', badge(p.stage, STAGE[p.stage]))}${kpi('Still in production', s.inProd.toLocaleString() + ' units')}${kpi('Stock in warehouse', s.stock.toLocaleString())}${kpi('Units sold', s.sold.toLocaleString())}${kpi('Revenue', money(s.rev))}${kpi('Sell-through', pct(s.st))}</div></div>
    <button class="ghost" data-clear>Clear selection</button></section>`;
}

/* ---------- Sales metrics ---------- */
const aggSales = rows => rows.reduce((o, r) => ({
  units: o.units + r.units, revenue: o.revenue + r.revenue, list: o.list + r.list,
  orders: o.orders + r.orders, repeat: o.repeat + r.repeat, saleUnits: o.saleUnits + r.saleUnits
}), {units:0, revenue:0, list:0, orders:0, repeat:0, saleUnits:0});
const ratio = (a, b) => b ? a / b : 0;
function salesKpis() {
  const ids = fpIds();
  const rows = DATA.sales.filter(r => ids.includes(r.sku) && inRange(r.m));
  const all = aggSales(rows);
  const web = aggSales(rows.filter(r => r.ch === 'Website'));
  const store = aggSales(rows.filter(r => r.ch === 'North Melbourne store'));
  return {
    aovAll: ratio(all.revenue, all.orders), aovWeb: ratio(web.revenue, web.orders), aovStore: ratio(store.revenue, store.orders),
    discountDepth: 1 - ratio(all.revenue, all.list), saleShare: ratio(all.saleUnits, all.units),
    repeatAll: ratio(all.repeat, all.orders), repeatWeb: ratio(web.repeat, web.orders), repeatStore: ratio(store.repeat, store.orders)
  };
}
/* Months from launch until current stock sells out, at the last three months' sales rate */
function sellOutMonths(p) {
  if (p.stage !== 'Launched') return null;
  const recent = sum(DATA.sales.filter(r => r.sku === p.id && r.m >= 8), 'units') / 3;
  if (!recent) return null;
  return (11 - p.launch) + sizeTotal(p.id) / recent;
}
const soText = p => { const v = sellOutMonths(p); return v === null ? '—' : v.toFixed(1) + ' months'; };

/* ---------- Inventory metrics ---------- */
/* Weekly rate uses the last 13 weeks (Sep–Nov). Dead stock = launched, in stock, no sales in that window. */
function invMetrics(p) {
  const recent = sum(DATA.sales.filter(r => r.sku === p.id && r.m >= 8), 'units');
  const weekly = recent / 13, stock = sizeTotal(p.id), sold = stats(p.id).sold;
  return {
    weekly, weeks: weekly ? stock / weekly : null, ratio: sold ? stock / sold : null,
    dead: p.stage === 'Launched' && recent === 0 && stock > 0
  };
}
const weeksText = m => m.weeks === null ? '—' : m.weeks.toFixed(1) + ' wks';
const ratioText = m => m.ratio === null ? '—' : m.ratio.toFixed(2) + '×';
function coverClass(m) { if (m.weeks === null) return 'na'; return m.weeks < 12 ? 'low' : m.weeks > 26 ? 'over' : ''; }

  </div>
  <h3>Top sellers</h3><p class="note" style="margin:0 0 8px">Time to sell out is estimated from the last three months' sales rate and current stock.</p>
  <div class="tablewrap"><table><thead><tr><th>Product</th><th>Website</th><th>North Melbourne store</th><th>Units</th><th>Revenue</th><th>Sell-through</th><th>Time to sell out</th></tr></thead><tbody>
  ${top.map(x => `<tr data-sku="${x.p.id}" class="${S.sku === x.p.id ? 'sel' : ''}"><td><div class="tp">${thumb(x.p)}<div><b>${x.p.name}</b><br><small class="muted">${x.p.colour}</small></div></div></td>
    <td>${chUnits(x.sl, 'Website')}</td><td>${chUnits(x.sl, 'North Melbourne store')}</td>
    <td>${x.sold.toLocaleString()}</td><td>${money(x.rev)}</td><td>${pct(x.st)}</td><td>${soText(x.p)}</td></tr>`).join('')}
  </tbody></table></div>`;
};

/* ---------- Insights: recomputed from the data and filters on every change ---------- */
const revenueIn = (m, ids = fpIds()) => DATA.sales.filter(r => ids.includes(r.sku) && r.m === m).reduce((a, r) => a + r.revenue, 0);
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
const ins = {
  overview() {
    const rows = fp(), ids = fpIds();
    const open = DATA.purchaseOrders.filter(o => ids.includes(o.sku) && o.stage !== 'Received');
    const late = open.filter(o => delayOf(o) > 0).sort((a, b) => delayOf(b) - delayOf(a));
    const lowP = rows.filter(p => p.stage === 'Launched' && DATA.sizes.some(z => DATA.stock[p.id][z] <= 2));
    const awaiting = rows.filter(p => p.stage !== 'Launched');
    const nov = revenueIn(10, ids), oct = revenueIn(9, ids);
    const change = oct ? Math.round((nov - oct) / oct * 100) : null;
    const watch = [
      late.length ? `${plural(late.length, 'purchase order is', 'purchase orders are')} past the expected arrival date. The worst is ${late[0].po}, ${delayOf(late[0])} days late.` : 'No purchase orders are running late.',
      lowP.length ? `${plural(lowP.length, 'launched product has', 'launched products have')} sizes at 2 units or fewer.` : 'No launched product is low on any size.',
      change !== null ? `November revenue is ${change >= 0 ? 'up' : 'down'} ${Math.abs(change)}% on October across this selection.` : 'Not enough October sales to compare with November.'
    ];
    const act = [];
    if (late.length) act.push(`Contact ${late[0].factory} about ${late[0].po} and get a confirmed new ship date.`);
    if (lowP.length) act.push(`Check reorders for ${lowP[0].name} (${lowP[0].colour}) before the low sizes sell out.`);
    if (awaiting.length) act.push(`Review the sample for ${awaiting[0].name} (${awaiting[0].colour}) so the launch date holds.`);
    return {watch, act};
  },
  design() {
    const pipe = fp().filter(p => p.stage !== 'Launched').sort((a, b) => new Date(a.target) - new Date(b.target));
    const waiting = pipe.filter(p => p.stage === 'Sample in progress');
    const approved = pipe.filter(p => p.stage === 'Sample approved');
    const watch = [
      pipe.length ? `${plural(pipe.length, 'product is', 'products are')} still in development. The next launch is ${pipe[0].name} (${pipe[0].colour}) on ${fmtDate(pipe[0].target)}.` : 'Everything in this selection has launched.',
      `${plural(waiting.length, 'product is', 'products are')} waiting on sample approval.`,
      `${plural(fp().filter(p => p.stage === 'Launched').length, 'product is', 'products are')} live in this selection.`
    ];
    const act = [];
    if (waiting[0]) act.push(`Approve or send back sample round ${waiting[0].sample} for ${waiting[0].name} (${waiting[0].colour}).`);
    if (approved[0]) act.push(`Lock the production PO for ${approved[0].name} (${approved[0].colour}) to protect the ${fmtDate(approved[0].target)} launch.`);
    return {watch, act};
  },
  production() {
    const pos = DATA.purchaseOrders.filter(o => fpIds().includes(o.sku));
    const open = pos.filter(o => o.stage !== 'Received');
    const late = open.filter(o => delayOf(o) > 0).sort((a, b) => delayOf(b) - delayOf(a));
    const transit = pos.filter(o => o.stage === 'In transit');
    const slow = pos.filter(o => o.stage === 'Cutting' && o.produced / o.ordered < .5);
    const units = open.reduce((a, o) => a + o.ordered - o.produced, 0);
    const watch = [
      `${units.toLocaleString()} units are still to be produced across ${plural(open.length, 'open PO', 'open POs')}.`,
      late.length ? `${plural(late.length, 'PO is', 'POs are')} late, the worst by ${delayOf(late[0])} days.` : 'No open POs are late.',
      transit.length ? `${plural(transit.length, 'PO is', 'POs are')} at sea on the way to Vermont South.` : 'Nothing is in transit right now.'
    ];
    const act = [];
    if (late[0]) act.push(`Escalate ${late[0].po} with ${late[0].factory} and agree a recovery date.`);
    if (transit[0]) act.push(`Book receiving at Vermont South for ${transit[0].po} against its ${fmtDate(transit[0].eta)} arrival.`);
    if (slow[0]) act.push(`Check progress on ${slow[0].po}. It is still in cutting and under half complete.`);
    return {watch, act};
  },
  inventory() {
    const ps = fp().filter(p => p.stage === 'Launched');
    const reorder = ps.filter(p => sizeTotal(p.id) <= p.reorder);
    const lowSizes = ps.reduce((a, p) => a + DATA.sizes.filter(z => DATA.stock[p.id][z] <= 2).length, 0);
    const over = ps.filter(p => DATA.sizes.some(z => DATA.stock[p.id][z] >= 16));
    const watch = [
      `${plural(reorder.length, 'product is', 'products are')} at or below the reorder point.`,
      `${plural(lowSizes, 'size has', 'sizes have')} 2 units or fewer across the range.`,
      over.length ? `${plural(over.length, 'product has', 'products have')} overstocked sizes (16+ units).` : 'No sizes are overstocked.'
    ];
    const act = [];
    if (reorder[0]) {
      const last = DATA.purchaseOrders.filter(o => o.sku === reorder[0].id).pop();
      const weeks = last ? Math.round(leadDays(last) / 7) : null;
      act.push(`Raise a reorder for ${reorder[0].name} (${reorder[0].colour}) now${weeks ? `. Sea freight from China takes about ${weeks} weeks` : ''}.`);
    }
    if (over[0]) act.push(`Move the overstocked sizes of ${over[0].name} (${over[0].colour}) to the North Melbourne store or promote them online.`);
    return {watch, act};
  },
  sales() {
    const st = fp().map(p => ({p, ...stats(p.id)})).filter(x => x.sold > 0);
    const top = [...st].sort((a, b) => b.rev - a.rev)[0];
    const sold = sum(st, 'sold'), stock = sum(st, 'stock');
    const store = sum(st.map(x => ({u: chUnits(x.sl, 'North Melbourne store')})), 'u');
    const slow = st.filter(x => x.st < .2 && x.stock > 0).sort((a, b) => a.st - b.st);
    const watch = [
      top ? `${top.p.name} (${top.p.colour}) is the top seller with ${money(top.rev)} in revenue.` : 'No sales in this selection yet.',
      `Sell-through is ${pct(sold / ((sold + stock) || 1))} across this selection. The North Melbourne store sells ${pct(sold ? store / sold : 0)} of units.`,
      slow.length ? `${plural(slow.length, 'product has', 'products have')} sell-through under 20% and still have stock.` : 'Every product in this selection is selling through well.'
    ];
    const act = [];
    if (slow[0]) act.push(`Plan a promotion or store feature for ${slow[0].p.name} (${slow[0].p.colour}), which has ${slow[0].stock} units in the warehouse.`);
    if (top) act.push(`Keep ${top.p.name} in stock in every size. Check the low-size list on the Inventory tab first.`);
    return {watch, act};
  }
};
function insightHTML(tab) {
  const d = ins[tab]();
  if (!d.act.length) d.act.push('Nothing urgent here. Use the Sales tab to plan the next drop.');
  return `<section class="insights"><div class="ins-head"><b>Insights</b><span class="muted">Updates with your filters</span></div>
    <div class="ins-cols"><div><h4>What matters</h4><ul>${d.watch.map(t => `<li>${t}</li>`).join('')}</ul></div>
    <div><h4>Do this first</h4><ol>${d.act.map(t => `<li>${t}</li>`).join('')}</ol></div></div></section>`;
}

const imgCache = {};
function imgObj(p) {
  if (!p.img) return null;
  if (!imgCache[p.id]) { const im = new Image(); im.src = p.img; imgCache[p.id] = im; }
  return imgCache[p.id];
}
/* Draws a small product photo at the end of each horizontal bar */
const endImages = {
  id: 'endImages',
  afterDatasetsDraw(chart, args, opts) {
    if (!opts || !opts.items) return;
    const ctx = chart.ctx, bars = chart.getDatasetMeta(0).data, size = 46;
    bars.forEach((bar, i) => {
      const it = opts.items[i];
      if (!it) return;
      const x = bar.x + 10, y = bar.y - size / 2;
      ctx.save();
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, size, size, 6); else ctx.rect(x, y, size, size);
      ctx.clip();
      if (it.im && it.im.complete && it.im.naturalWidth) {
        ctx.drawImage(it.im, x, y, size, size);
      } else {
        ctx.fillStyle = css('--ph'); ctx.fillRect(x, y, size, size);
        ctx.fillStyle = css('--muted'); ctx.font = '700 13px system-ui';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(it.txt, x + size / 2, y + size / 2);
        if (it.im && !it.im.complete) it.im.onload = () => chart.draw();
      }
      ctx.restore();
    });
  }
};
Chart.register(endImages);

const TABS = [['overview','Overview'], ['design','Design & Development'], ['production','Production'], ['inventory','Inventory'], ['sales','Sales']];

function render() {
  Chart.defaults.color = css('--muted');
  Chart.defaults.borderColor = css('--line');
  Chart.defaults.font.family = 'system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  pending.length = 0;
  $('#view').innerHTML = insightHTML(S.tab) + V[S.tab]();
  pending.forEach(([id, cfg]) => { const el = document.getElementById(id); if (el) new Chart(el, cfg); });
  renderPills();
}

/* ---------- Wiring ---------- */
$('#tabs').innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}">${l}</button>`).join('');
$('[data-f=cat]').innerHTML = ['All', ...new Set(DATA.products.map(p => p.category))].map(v => `<option>${v}</option>`).join('');
$('[data-f=season]').innerHTML = ['All', ...new Set(DATA.products.map(p => p.season))].map(v => `<option>${v}</option>`).join('');

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; render(); return; }
  if (e.target.closest('#theme')) {
    document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    render(); return;
  }
  if (e.target.closest('[data-clear]')) { S.sku = null; render(); return; }
  const row = e.target.closest('[data-sku]');
  if (row) { S.sku = S.sku === row.dataset.sku ? null : row.dataset.sku; render(); }
});
document.addEventListener('change', e => {
  const f = e.target.dataset.f;
  if (f) { S[f] = e.target.value; render(); }
});
/* ---------- Dashboard assistant (Claude, via the page's sample capability) ---------- */
const CHAT = [];
let sampleFn = null, busy = false;
const PROMPTS = {
  overview: ['What needs my attention first?', 'How is revenue trending this month?', 'Which product is selling best?'],
  design: ['Which products are waiting for sample approval?', 'What launches next, and when?', 'How many products are still in development?'],
  production: ['Which purchase orders are running late?', 'How many units are still being made?', 'Which orders are in transit to Vermont South?'],
  inventory: ['Which products need reordering now?', 'Which sizes are low on stock?', 'Which products are overstocked?'],
  sales: ['Which sales channel sells the most?', 'Which product has the lowest sell-through?', 'How did November revenue compare with October?']
};
function snapshot() {
  const ids = fpIds();
  const chRows = DATA.channels.map(ch => {
    const rows = DATA.sales.filter(r => ids.includes(r.sku) && inRange(r.m) && r.ch === ch);
    return {channel: ch, units: sum(rows, 'units'), revenue: sum(rows, 'revenue')};
  });
  return {
    asOf: DATA.asOf, currency: 'AUD', note: 'Sample data for a proof of concept',
    view: {tab: S.tab, dateRange: S.range, category: S.cat, season: S.season,
      selectedProduct: S.sku ? prod(S.sku).name + ' · ' + prod(S.sku).colour : null},
    products: fp().map(p => { const s = stats(p.id); return {
      name: p.name, colour: p.colour, category: p.category, season: p.season, price: p.price, stage: p.stage,
      targetLaunch: p.target, unitsSold: s.sold, revenue: s.rev, sellThrough: pct(s.st),
      stockInWarehouse: s.stock, unitsStillInProduction: s.inProd, stockBySize: DATA.stock[p.id], reorderPoint: p.reorder }; }),
    purchaseOrders: DATA.purchaseOrders.filter(o => ids.includes(o.sku)).map(o => ({
      po: o.po, product: prod(o.sku).name + ' · ' + prod(o.sku).colour, factory: o.factory, ordered: o.ordered,
      produced: o.produced, stage: o.stage, eta: o.eta, daysLate: delayOf(o), leadTimeDays: leadDays(o) })),
    salesByChannel: chRows,
    revenueOctober: revenueIn(9, ids), revenueNovember: revenueIn(10, ids),
    alerts: alerts().map(a => a.t),
    salesKpis: salesKpis()
  };
}
function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  const box = $('#msgs');
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return d;
}
function setNote(t) { $('#chat-note').textContent = t; }
function setInputEnabled(on) { $('#chat-input').disabled = !on; document.querySelector('.send').disabled = !on; }
function renderPills() {
  const box = $('#pills');
  box.innerHTML = '';
  (PROMPTS[S.tab] || []).forEach(q => {
    const b = document.createElement('button');
    b.className = 'pill-q';
    b.textContent = q;
    b.disabled = !sampleFn;
    b.addEventListener('click', () => ask(q));
    box.appendChild(b);
  });
}
async function ask(q) {
  q = (q || '').trim();
  if (!q || !sampleFn || busy) return;
  busy = true;
  setInputEnabled(false);
  renderPills();
  addMsg('user', q);
  const reply = addMsg('assistant', 'Thinking…');
  const history = CHAT.slice(-6).map(m => `${m.role === 'user' ? 'User' : 'Assistant'}: ${m.content}`).join('\n');
  const prompt = [
    'You are the assistant inside the Radical Yes product lifecycle dashboard, a proof of concept for an Australian footwear and bag brand. Answer in clear, natural language in under 120 words. Use only the dashboard data below, and name specific products and figures. If the data cannot answer the question, say so and suggest which tab would have the answer. Do not invent figures.',
    'Dashboard data (JSON):\n' + JSON.stringify(snapshot()),
    history ? 'Conversation so far:\n' + history : '',
    'User question: ' + q
  ].filter(Boolean).join('\n\n');
  try {
    const r = await sampleFn(prompt, {modelTier: 'quick', onText: ({text}) => { reply.textContent = text; }});
    const answer = (r && r.text) || 'Sorry, I could not find an answer to that.';
    reply.textContent = answer;
    CHAT.push({role: 'user', content: q}, {role: 'assistant', content: answer});
  } catch (err) {
    if (err && err.code === 'rate_limited') reply.textContent = 'Too many questions in a short time. Try again in a minute.';
    else reply.textContent = 'Sorry, the assistant could not answer just now.';
    if (err && err.code === 'not_granted') { sampleFn = null; setNote('The assistant is not available in this view.'); }
  } finally {
    busy = false;
    setInputEnabled(!!sampleFn);
    renderPills();
  }
}
const chatPop = $('#chat');
function openChat() {
  chatPop.hidden = false;
  if (!$('#msgs').children.length) addMsg('assistant', "Hey there! I'm your Shoe Chatbot, ask me anything!");
  $('#chat-input').focus();
}
function closeChat() { chatPop.hidden = true; }
$('#shoe-fab').addEventListener('click', () => (chatPop.hidden ? openChat() : closeChat()));
$('#chat-close').addEventListener('click', closeChat);
$('#chat-form').addEventListener('submit', e => {
  e.preventDefault();
  const input = $('#chat-input');
  const q = input.value;
  input.value = '';
  ask(q);
});
setInputEnabled(false);
setNote('Connecting the assistant…');
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('sample').then(s => {
    sampleFn = s || null;
    setNote(sampleFn ? 'Answers use the data on this page' : 'The assistant is not available in this view.');
    setInputEnabled(!!sampleFn);
    renderPills();
  }).catch(() => setNote('The assistant is not available in this view.'));
} else {
  setNote('The assistant is not available in this view.');
}

render();
</script>
